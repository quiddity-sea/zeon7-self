<VirtualHost *:443>
	ServerAdmin webmaster@localhost
	DocumentRoot /var/www/zeon7.com/self/public
	
	<Directory /var/www/zeon7.com/self/public/>
		# Enable .htaccess for URL rewriting (API routing)
		AllowOverride All
		Require all granted
	</Directory>
	
	ServerName self.zeon7.com:443
	ServerAlias www.self.zeon7.com

	ErrorLog ${APACHE_LOG_DIR}/self-error.log
	CustomLog ${APACHE_LOG_DIR}/self-access.log combined

	SSLEngine on

	SSLCertificateFile    /home/zeon7/myCerts/wildcard-zeon7.com/wildcard-cert_zeon7.com.crt
	SSLCertificateKeyFile /home/zeon7/myCerts/wildcard-zeon7.com/priv_key_wildcard-zeon7.com.pem
	SSLCACertificateFile /etc/ssl/certs/cert-ourca.crt

	<FilesMatch "\.(cgi|shtml|phtml|php)$">
		SSLOptions +StdEnvVars
	</FilesMatch>
	<Directory /usr/lib/cgi-bin>
		SSLOptions +StdEnvVars
	</Directory>
	<FilesMatch \.php>
		SetHandler "proxy:unix:/var/run/php/php8.0-fpm.sock|fcgi://localhost/"
	</FilesMatch>
</VirtualHost>
